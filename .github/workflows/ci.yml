name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npx --yes npm@12.2.1 ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
